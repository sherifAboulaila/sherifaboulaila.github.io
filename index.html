<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shrief Aboulailah — Android Apps</title>
<meta name="description" content="Android apps by Shrief Aboulailah — IET Academy and more.">
<style>
:root{--ink:#14213D;--amber:#FCA311;--amber-d:#D98A0B;--paper:#F5F2EA;--muted:#6B7285;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;}
header{background:linear-gradient(135deg,#1D2E52,var(--ink));color:#fff;text-align:center;padding:50px 20px 40px;}
.logo{width:72px;height:72px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(145deg,#FDBA3B,var(--amber-d));display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 30px rgba(252,163,17,.35);}
h1{font-size:26px;margin-bottom:6px;}
header p{color:rgba(255,255,255,.65);font-size:14px;}
main{flex:1;max-width:600px;width:100%;margin:0 auto;padding:28px 18px;}
.app{background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 18px rgba(20,33,61,.07);display:flex;gap:16px;align-items:center;margin-bottom:14px;}
.app .ic{width:58px;height:58px;flex-shrink:0;border-radius:16px;background:var(--ink);display:flex;align-items:center;justify-content:center;font-size:28px;}
.app h2{font-size:17px;margin-bottom:4px;}
.app p{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.6;}
.app a{display:inline-block;font-size:12.5px;font-weight:700;color:var(--amber-d);text-decoration:none;margin-left:14px;}
footer{text-align:center;padding:24px;font-size:13px;color:var(--muted);}
footer a{color:var(--amber-d);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
<header>
  <div class="logo">⚡</div>
  <h1>Shrief Aboulailah</h1>
  <p>Android Apps Developer · مطور تطبيقات أندرويد</p>
</header>
<main>
  <div class="app">
    <div class="ic">🎓</div>
    <div>
      <h2>IET Academy</h2>
      <p>تطبيق تعليمي لحماية وتشغيل أنظمة القوى الكهربائية — فيديوهات ومسارات تعلم واختبارات.</p>
      <a href="https://play.google.com/store/apps/details?id=com.shriefaboulailah.ietacademy">Google Play ↗</a>
      <a href="https://sherifaboulaila.github.io/privacy-IET-Academy/">سياسة الخصوصية</a>
    </div>
  </div>
</main>
<footer>
  تواصل: <a href="mailto:shriefaboulailah@gmail.com">shriefaboulailah@gmail.com</a>
</footer>
</body>
</html>
